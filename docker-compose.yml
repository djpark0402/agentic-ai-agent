services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic_ai}
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentic_dev_pw}
    ports:
      - "${POSTGRES_PORT:-54086}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: agentic-ai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # 컨테이너 네트워크에서는 호스트 이름이 "postgres"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic_dev_pw}@postgres:5432/${POSTGRES_DB:-agentic_ai}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic_dev_pw}@postgres:5432/${POSTGRES_DB:-agentic_ai}
    ports:
      - "54085:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: agentic-ai-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "54084:80"

volumes:
  postgres_data:
